<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Nail Studio - Gestión inteligente para salón de uñas</title>
    
    <!-- SEO y Meta Tags Básicos -->

    <meta property="og:title" content="Nail Studio - Gestión inteligente para tu salón de uñas" />

    <link rel="canonical" href="https://nailstudio.app/" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <link rel="manifest" href="/manifest.json" />
